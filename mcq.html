<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title id="mcq-page-title">Practice MCQs - Study Bull</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  
  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    
    .option-card {
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .option-card:active:not(.locked) {
      transform: scale(0.98);
    }

    @keyframes opt-pulse-correct {
      0% { transform: scale(1); }
      50% { transform: scale(1.02); }
      100% { transform: scale(1); }
    }

    @keyframes opt-shake-wrong {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-6px); }
      40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }

    .correct-anim {
      animation: opt-pulse-correct 0.35s ease;
    }

    .wrong-anim {
      animation: opt-shake-wrong 0.4s ease;
    }
  </style>
</head>
<body class="bg-[#f4f7fb] min-h-screen text-slate-800 pb-24 select-none">

  <!-- TOP HEADER -->
  <header class="bg-[#0b47b3] text-white py-3.5 px-4 shadow sticky top-0 z-50">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <button onclick="window.history.back()" class="w-9 h-9 bg-white/10 hover:bg-white/20 active:bg-white/30 rounded-xl flex items-center justify-center text-white transition">
          <i class="fa-solid fa-arrow-left text-base"></i>
        </button>
        <div>
          <h1 id="subject-title" class="text-base font-bold leading-tight truncate max-w-[190px]">MCQ Practice</h1>
          <p id="mcq-subtitle" class="text-[11px] text-blue-200 font-medium">Practice &amp; Learn</p>
        </div>
      </div>
      <!-- Score Pill -->
      <div class="bg-blue-900/60 border border-blue-400/30 px-3 py-1 rounded-full text-xs font-bold text-blue-100 flex items-center gap-1.5">
        <i class="fa-regular fa-circle-check text-emerald-400"></i>
        <span id="score-counter">0 / 0</span>
      </div>
    </div>
  </header>

  <!-- SCREEN 1: ACTIVE QUIZ SCREEN -->
  <main id="quiz-screen" class="max-w-md mx-auto p-4">

    <!-- Progress Bar -->
    <div class="w-full bg-slate-200 h-1.5 rounded-full mb-4 overflow-hidden">
      <div id="progress-bar" class="bg-blue-600 h-full w-0 transition-all duration-300"></div>
    </div>

    <!-- Question Card -->
    <div class="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm mb-4 relative">
      <div class="flex items-center justify-between mb-3">
        <span id="question-index-badge" class="text-[11px] font-extrabold uppercase tracking-wider text-blue-600 bg-blue-50 px-2.5 py-1 rounded-md">
          Question 1
        </span>
      </div>
      <p id="question-text" class="text-[15px] font-bold text-slate-800 leading-relaxed">
        Loading question...
      </p>
    </div>

    <!-- Options Container -->
    <div id="options-container" class="space-y-3"></div>

    <!-- 1-Line Explanation Box -->
    <div id="explanation-box" class="hidden mt-4 bg-emerald-50 border border-emerald-200 rounded-2xl p-4 shadow-sm transition-all duration-300">
      <div class="flex items-center gap-2 text-emerald-800 font-bold text-xs uppercase tracking-wider mb-1">
        <i class="fa-solid fa-lightbulb text-amber-500 text-sm"></i>
        <span>Explanation</span>
      </div>
      <p id="explanation-text" class="text-xs text-emerald-950 font-medium leading-relaxed"></p>
    </div>

  </main>

  <!-- SCREEN 2: POST-TEST DEEP ANALYSIS SCREEN (Initially Hidden) -->
  <main id="analysis-screen" class="max-w-md mx-auto p-4 hidden">
    
    <!-- Score Card Overview -->
    <div class="bg-white border border-slate-200 rounded-3xl p-5 shadow-sm text-center mb-5">
      <div class="w-14 h-14 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center text-2xl mx-auto mb-2.5">
        <i class="fa-solid fa-chart-pie"></i>
      </div>
      <h2 class="text-lg font-black text-slate-800">Test Analysis &amp; Report</h2>
      <p class="text-xs text-slate-400 mt-0.5">Apna detailed performance summary dekhein</p>

      <div class="grid grid-cols-3 gap-2.5 mt-4 pt-4 border-t border-slate-100">
        <div class="bg-emerald-50 border border-emerald-100 rounded-2xl p-2.5 text-center">
          <span class="text-[10px] font-bold text-emerald-600 block uppercase">Correct</span>
          <span id="anal-correct" class="text-lg font-extrabold text-emerald-700">0</span>
        </div>
        <div class="bg-rose-50 border border-rose-100 rounded-2xl p-2.5 text-center">
          <span class="text-[10px] font-bold text-rose-600 block uppercase">Wrong</span>
          <span id="anal-wrong" class="text-lg font-extrabold text-rose-700">0</span>
        </div>
        <div class="bg-blue-50 border border-blue-100 rounded-2xl p-2.5 text-center">
          <span class="text-[10px] font-bold text-blue-600 block uppercase">Accuracy</span>
          <span id="anal-accuracy" class="text-lg font-extrabold text-blue-700">0%</span>
        </div>
      </div>

      <div class="flex gap-2.5 mt-4">
        <a href="index.html" class="w-1/2 py-2.5 bg-slate-100 hover:bg-slate-200 font-bold text-xs rounded-xl text-slate-700 transition">
          Home Portal
        </a>
        <button onclick="location.reload()" class="w-1/2 py-2.5 bg-blue-600 hover:bg-blue-700 font-bold text-xs rounded-xl text-white transition">
          Reattempt Test
        </button>
      </div>
    </div>

    <!-- Detailed Solutions Header -->
    <h3 class="font-black text-slate-800 text-sm uppercase tracking-wider mb-3 flex items-center gap-2">
      <i class="fa-solid fa-list-check text-blue-600"></i> Detailed Solutions Review
    </h3>

    <!-- List of All Questions With Full Analysis -->
    <div id="analysis-list" class="space-y-4"></div>

  </main>

  <!-- FIXED BOTTOM CONTROLS FOR QUIZ -->
  <footer id="quiz-footer" class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 py-3 px-4 shadow-lg z-40">
    <div class="max-w-md mx-auto flex items-center justify-between gap-3">
      <button 
        id="prev-btn" 
        onclick="prevQuestion()" 
        class="w-1/3 py-2.5 bg-slate-100 active:bg-slate-200 text-slate-700 rounded-xl font-bold text-xs flex items-center justify-center gap-1.5 transition disabled:opacity-40 disabled:cursor-not-allowed">
        <i class="fa-solid fa-chevron-left text-[10px]"></i> Previous
      </button>

      <button 
        id="next-btn" 
        onclick="nextQuestion()" 
        class="w-2/3 py-2.5 bg-[#0b47b3] active:bg-blue-800 text-white rounded-xl font-bold text-xs flex items-center justify-center gap-1.5 shadow-md shadow-blue-500/20 transition">
        Next Question <i class="fa-solid fa-chevron-right text-[10px]"></i>
      </button>
    </div>
  </footer>

  <!-- ========================================== -->
  <!-- MCQ ENGINE WITH AUTO ANALYSIS              -->
  <!-- ========================================== -->
  <script>
    const QUESTION_BANK = {
      default: [
        {
          id: 1,
          question: "सिंधु घाटी सभ्यता का प्रमुख बंदरगाह नगर कौन सा था?",
          options: ["कालीबंगा", "लोथल", "रोपड़", "मोहनजोदड़ो"],
          correct: 1,
          explanation: "लोथल गुजरात के भोगवा नदी के तट पर स्थित सिंधु घाटी सभ्यता का प्रमुख प्राचीन बंदरगाह शहर था।"
        },
        {
          id: 2,
          question: "भारतीय संविधान की कौन सी अनुसूची भाषाओं से संबंधित है?",
          options: ["7वीं अनुसूची", "8वीं अनुसूची", "9वीं अनुसूची", "10वीं अनुसूची"],
          correct: 1,
          explanation: "भारतीय संविधान की 8वीं अनुसूची में वर्तमान में 22 आधिकारिक भाषाओं का उल्लेख किया गया है।"
        },
        {
          id: 3,
          question: "कर्क रेखा भारत के कितने राज्यों से होकर गुजरती है?",
          options: ["6", "7", "8", "9"],
          correct: 2,
          explanation: "कर्क रेखा भारत के 8 राज्यों (गुजरात, राजस्थान, मध्य प्रदेश, छत्तीसगढ़, झारखंड, पश्चिम बंगाल, त्रिपुरा, मिजोरम) से गुजरती है।"
        },
        {
          id: 4,
          question: "मानव शरीर में रक्त का शुद्धिकरण किस अंग में होता है?",
          options: ["हृदय", "फेफड़े", "वृक्क (Kidney)", "यकृत (Liver)"],
          correct: 2,
          explanation: "वृक्क (Kidney) रक्त से यूरिया, अतिरिक्त लवण और विषाक्त पदार्थों को छानकर अलग करता है।"
        }
      ]
    };

    let questions = [];
    let currentIndex = 0;
    let selectedAnswers = {}; // { questionIndex: chosenOptionIndex }
    let correctCount = 0;

    function initMCQPage() {
      const urlParams = new URLSearchParams(window.location.search);
      const subjectKey = urlParams.get('subject') || 'default';
      const topicKey = urlParams.get('topic') || '';

      questions = QUESTION_BANK[topicKey] || QUESTION_BANK[subjectKey] || QUESTION_BANK.default;

      document.getElementById("subject-title").textContent = 
        (topicKey || subjectKey).replace(/_/g, ' ').toUpperCase();

      loadQuestion(0);
    }

    function loadQuestion(index) {
      if (index < 0 || index >= questions.length) return;
      currentIndex = index;

      const q = questions[currentIndex];

      document.getElementById("question-index-badge").textContent = `Question ${currentIndex + 1} of ${questions.length}`;
      document.getElementById("question-text").textContent = q.question;
      
      const progressPercent = ((currentIndex + 1) / questions.length) * 100;
      document.getElementById("progress-bar").style.width = `${progressPercent}%`;

      document.getElementById("prev-btn").disabled = (currentIndex === 0);
      document.getElementById("next-btn").innerHTML = (currentIndex === questions.length - 1)
        ? `Finish & View Analysis <i class="fa-solid fa-chart-simple text-[10px]"></i>`
        : `Next Question <i class="fa-solid fa-chevron-right text-[10px]"></i>`;

      const optionsContainer = document.getElementById("options-container");
      optionsContainer.innerHTML = "";

      const alphabet = ["A", "B", "C", "D"];
      const hasAnswered = selectedAnswers.hasOwnProperty(currentIndex);
      const selectedOpt = selectedAnswers[currentIndex];

      q.options.forEach((optText, optIdx) => {
        let cardClasses = "bg-white border-slate-200 text-slate-700";
        let badgeClasses = "bg-slate-100 text-slate-600 border-slate-200";
        let iconHtml = "";

        if (hasAnswered) {
          if (optIdx === q.correct) {
            cardClasses = "bg-emerald-50 border-emerald-500 text-emerald-900";
            badgeClasses = "bg-emerald-500 text-white border-emerald-500";
            iconHtml = `<i class="fa-solid fa-circle-check text-emerald-600 text-base"></i>`;
          } else if (optIdx === selectedOpt) {
            cardClasses = "bg-rose-50 border-rose-500 text-rose-900";
            badgeClasses = "bg-rose-500 text-white border-rose-500";
            iconHtml = `<i class="fa-solid fa-circle-xmark text-rose-600 text-base"></i>`;
          } else {
            cardClasses = "bg-white border-slate-200 opacity-60 text-slate-500";
          }
        }

        const btn = document.createElement("button");
        btn.className = `option-card ${hasAnswered ? 'locked' : ''} w-full border-2 rounded-2xl p-3.5 flex items-center justify-between text-left shadow-sm ${cardClasses}`;
        btn.onclick = () => handleSelectOption(optIdx);

        btn.innerHTML = `
          <div class="flex items-center gap-3">
            <span class="w-7 h-7 rounded-lg border flex items-center justify-center font-bold text-xs ${badgeClasses}">
              ${alphabet[optIdx]}
            </span>
            <span class="font-semibold text-sm leading-snug">${optText}</span>
          </div>
          <div>${iconHtml}</div>
        `;

        optionsContainer.appendChild(btn);
      });

      const explBox = document.getElementById("explanation-box");
      const explText = document.getElementById("explanation-text");

      if (hasAnswered) {
        explText.textContent = q.explanation;
        explBox.classList.remove("hidden");
      } else {
        explBox.classList.add("hidden");
      }

      updateScoreBadge();
    }

    function handleSelectOption(optIdx) {
      if (selectedAnswers.hasOwnProperty(currentIndex)) return;

      selectedAnswers[currentIndex] = optIdx;
      const q = questions[currentIndex];
      const isRight = (optIdx === q.correct);

      if (isRight) correctCount++;

      loadQuestion(currentIndex);

      const renderedCards = document.querySelectorAll(".option-card");
      if (isRight) {
        renderedCards[optIdx].classList.add("correct-anim");
      } else {
        renderedCards[optIdx].classList.add("wrong-anim");
      }
    }

    function nextQuestion() {
      if (currentIndex < questions.length - 1) {
        loadQuestion(currentIndex + 1);
      } else {
        showAnalysisScreen();
      }
    }

    function prevQuestion() {
      if (currentIndex > 0) loadQuestion(currentIndex - 1);
    }

    function updateScoreBadge() {
      const answeredTotal = Object.keys(selectedAnswers).length;
      document.getElementById("score-counter").textContent = `${correctCount} / ${answeredTotal}`;
    }

    // ==========================================
    // DEEP ANALYSIS SCREEN RENDER
    // ==========================================
    function showAnalysisScreen() {
      document.getElementById("quiz-screen").classList.add("hidden");
      document.getElementById("quiz-footer").classList.add("hidden");
      document.getElementById("analysis-screen").classList.remove("hidden");

      const total = questions.length;
      const answered = Object.keys(selectedAnswers).length;
      const wrong = answered - correctCount;
      const accuracy = answered > 0 ? Math.round((correctCount / answered) * 100) : 0;

      document.getElementById("anal-correct").textContent = correctCount;
      document.getElementById("anal-wrong").textContent = wrong;
      document.getElementById("anal-accuracy").textContent = `${accuracy}%`;

      const listContainer = document.getElementById("analysis-list");
      listContainer.innerHTML = "";

      questions.forEach((q, idx) => {
        const userChoice = selectedAnswers[idx];
        const hasAttempted = selectedAnswers.hasOwnProperty(idx);
        const isCorrect = (userChoice === q.correct);

        let statusBadge = "";
        let borderClass = "";

        if (!hasAttempted) {
          statusBadge = `<span class="bg-slate-100 text-slate-500 text-[10px] font-bold px-2 py-0.5 rounded">Skipped</span>`;
          borderClass = "border-slate-200";
        } else if (isCorrect) {
          statusBadge = `<span class="bg-emerald-100 text-emerald-700 text-[10px] font-bold px-2 py-0.5 rounded">Correct (+1)</span>`;
          borderClass = "border-emerald-300";
        } else {
          statusBadge = `<span class="bg-rose-100 text-rose-700 text-[10px] font-bold px-2 py-0.5 rounded">Wrong</span>`;
          borderClass = "border-rose-300";
        }

        const card = document.createElement("div");
        card.className = `bg-white border ${borderClass} rounded-2xl p-4 shadow-sm`;

        card.innerHTML = `
          <div class="flex items-center justify-between mb-2">
            <span class="text-xs font-bold text-slate-400">Q.${idx + 1}</span>
            ${statusBadge}
          </div>
          <p class="font-bold text-xs text-slate-800 mb-3">${q.question}</p>
          
          <div class="space-y-1.5 text-xs mb-3">
            <div class="p-2 rounded-lg ${hasAttempted && !isCorrect ? 'bg-rose-50 text-rose-800 font-semibold' : 'bg-slate-50 text-slate-600'}">
              <span class="font-bold">Your Answer:</span> ${hasAttempted ? q.options[userChoice] : "None"}
            </div>
            <div class="p-2 rounded-lg bg-emerald-50 text-emerald-800 font-semibold">
              <span class="font-bold">Correct Answer:</span> ${q.options[q.correct]}
            </div>
          </div>

          <div class="bg-slate-50 border border-slate-200/60 rounded-xl p-2.5 text-[11px] text-slate-600">
            <span class="font-bold text-slate-800 block mb-0.5">Explanation:</span>
            ${q.explanation}
          </div>
        `;
        listContainer.appendChild(card);
      });

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    document.addEventListener("DOMContentLoaded", initMCQPage);
  </script>
</body>
  </html>

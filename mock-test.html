<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Real Mock Test - Study Bull</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  
  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .option-radio {
      transition: all 0.15s ease;
    }
  </style>
</head>
<body class="bg-[#f4f7fb] min-h-screen text-slate-800 pb-24 select-none">

  <!-- TOP HEADER WITH REAL TIMER -->
  <header class="bg-[#0b47b3] text-white py-3 px-4 shadow sticky top-0 z-50">
    <div class="max-w-md mx-auto flex items-center justify-between">
      
      <!-- Test Name -->
      <div class="flex items-center gap-2.5">
        <button onclick="confirmExit()" class="w-8 h-8 bg-white/10 hover:bg-white/20 rounded-lg flex items-center justify-center text-white transition">
          <i class="fa-solid fa-arrow-left text-sm"></i>
        </button>
        <div>
          <h1 class="text-sm font-bold leading-tight">Full Mock Test #1</h1>
          <p class="text-[10px] text-blue-200">10 Questions • 10 Mins</p>
        </div>
      </div>

      <!-- Live Countdown Timer & Palette Toggle -->
      <div class="flex items-center gap-2">
        <div class="bg-blue-950/80 border border-blue-400/30 px-2.5 py-1 rounded-lg flex items-center gap-1.5 text-xs font-bold text-amber-300">
          <i class="fa-regular fa-clock"></i>
          <span id="timer-display">10:00</span>
        </div>
        
        <button onclick="togglePalette()" class="w-8 h-8 bg-white/15 hover:bg-white/25 active:bg-white/30 rounded-lg flex items-center justify-center text-white transition">
          <i class="fa-solid fa-table-cells-large text-xs"></i>
        </button>
      </div>

    </div>
  </header>

  <!-- QUESTION DISPLAY AREA -->
  <main class="max-w-md mx-auto p-4">
    
    <!-- Meta details (Marks, Status) -->
    <div class="flex items-center justify-between mb-3 text-xs">
      <span id="q-number-pill" class="font-extrabold text-blue-600 bg-blue-50 border border-blue-200 px-2.5 py-1 rounded-lg">
        Q. 1 / 10
      </span>
      <div class="flex items-center gap-2 font-semibold">
        <span class="text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded border border-emerald-200">+2.0</span>
        <span class="text-rose-600 bg-rose-50 px-2 py-0.5 rounded border border-rose-200">-0.5</span>
      </div>
    </div>

    <!-- Question Card -->
    <div class="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm mb-4">
      <p id="mock-question-text" class="text-sm font-bold text-slate-800 leading-relaxed min-h-[50px]">
        Loading question...
      </p>
    </div>

    <!-- Options List (Exam Radio Style) -->
    <div id="mock-options-container" class="space-y-2.5">
      <!-- Options render via JS -->
    </div>

    <!-- Extra Action Buttons -->
    <div class="flex items-center justify-between mt-5">
      <button onclick="clearResponse()" class="text-xs font-semibold text-rose-500 hover:text-rose-600 active:opacity-70 flex items-center gap-1">
        <i class="fa-solid fa-rotate-left"></i> Clear Response
      </button>

      <button onclick="markForReview()" id="review-btn" class="text-xs font-semibold text-purple-600 hover:text-purple-700 active:opacity-70 flex items-center gap-1">
        <i class="fa-regular fa-bookmark"></i> Mark for Review
      </button>
    </div>

  </main>

  <!-- FIXED BOTTOM CONTROLS -->
  <footer class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 py-3 px-4 shadow-lg z-40">
    <div class="max-w-md mx-auto flex items-center justify-between gap-3">
      <button 
        id="mock-prev-btn" 
        onclick="prevMockQuestion()" 
        class="w-1/3 py-2.5 bg-slate-100 active:bg-slate-200 text-slate-700 rounded-xl font-bold text-xs flex items-center justify-center gap-1.5 transition disabled:opacity-40">
        <i class="fa-solid fa-chevron-left text-[10px]"></i> Prev
      </button>

      <button 
        id="mock-next-btn" 
        onclick="saveAndNext()" 
        class="w-2/3 py-2.5 bg-[#0b47b3] active:bg-blue-800 text-white rounded-xl font-bold text-xs flex items-center justify-center gap-1.5 shadow-md shadow-blue-500/20 transition">
        Save &amp; Next <i class="fa-solid fa-chevron-right text-[10px]"></i>
      </button>
    </div>
  </footer>

  <!-- QUESTION PALETTE OVERLAY DRAWER -->
  <div id="palette-modal" class="fixed inset-0 bg-black/50 z-50 hidden transition-opacity flex justify-end">
    <div class="bg-white w-4/5 max-w-xs h-full p-4 flex flex-col shadow-2xl overflow-y-auto">
      
      <div class="flex items-center justify-between pb-3 border-b border-slate-100">
        <h2 class="font-bold text-sm text-slate-800">Question Palette</h2>
        <button onclick="togglePalette()" class="w-7 h-7 bg-slate-100 rounded-full flex items-center justify-center text-slate-500 text-xs">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <!-- Legend -->
      <div class="grid grid-cols-2 gap-2 my-3 text-[10px] font-semibold text-slate-600">
        <div class="flex items-center gap-1.5"><span class="w-3.5 h-3.5 rounded-full bg-emerald-500"></span> Answered</div>
        <div class="flex items-center gap-1.5"><span class="w-3.5 h-3.5 rounded-full bg-slate-200"></span> Not Visited</div>
        <div class="flex items-center gap-1.5"><span class="w-3.5 h-3.5 rounded-full bg-rose-500"></span> Not Answered</div>
        <div class="flex items-center gap-1.5"><span class="w-3.5 h-3.5 rounded-full bg-purple-500"></span> Marked Review</div>
      </div>

      <!-- Palette Grid Numbers -->
      <div id="palette-grid" class="grid grid-cols-4 gap-2 flex-grow overflow-y-auto pt-2">
        <!-- Render numbers via JS -->
      </div>

      <!-- Submit Test Trigger -->
      <button onclick="submitExam()" class="w-full mt-4 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-bold text-xs uppercase tracking-wider transition">
        Submit Test
      </button>

    </div>
  </div>

  <!-- RESULT & SCORE ANALYSIS MODAL -->
  <div id="result-modal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl p-6 max-w-sm w-full text-center shadow-2xl relative">
      <div class="w-16 h-16 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center text-3xl mx-auto mb-3">
        <i class="fa-solid fa-trophy"></i>
      </div>
      <h3 class="text-lg font-black text-slate-800">Test Submitted!</h3>
      <p class="text-xs text-slate-400 mt-0.5">Yahan hai aapka final performance scorecard</p>

      <div class="bg-[#f8fafc] border border-slate-200 rounded-2xl p-4 my-4 grid grid-cols-2 gap-3 text-left">
        <div>
          <span class="text-[10px] font-bold text-slate-400 block uppercase">Final Score</span>
          <span id="final-score" class="text-xl font-black text-blue-600">0 / 20</span>
        </div>
        <div>
          <span class="text-[10px] font-bold text-slate-400 block uppercase">Accuracy</span>
          <span id="final-accuracy" class="text-xl font-black text-emerald-600">0%</span>
        </div>
        <div>
          <span class="text-[10px] font-bold text-slate-400 block uppercase">Correct</span>
          <span id="final-correct" class="text-base font-bold text-emerald-600">0</span>
        </div>
        <div>
          <span class="text-[10px] font-bold text-slate-400 block uppercase">Wrong</span>
          <span id="final-wrong" class="text-base font-bold text-rose-500">0</span>
        </div>
      </div>

      <div class="flex gap-2">
        <a href="index.html" class="w-full py-2.5 bg-slate-100 hover:bg-slate-200 font-bold text-xs rounded-xl text-slate-700 transition">
          Home Page
        </a>
        <button onclick="location.reload()" class="w-full py-2.5 bg-blue-600 hover:bg-blue-700 font-bold text-xs rounded-xl text-white transition">
          Reattempt
        </button>
      </div>
    </div>
  </div>

  <!-- ========================================== -->
  <!-- MOCK TEST CORE ENGINE                      -->
  <!-- ========================================== -->
  <script>
    const MOCK_QUESTIONS = [
      { id: 1, text: "भारत के प्रथम राष्ट्रपति कौन थे?", options: ["डॉ. राजेंद्र प्रसाद", "डॉ. एस. राधाकृष्णन", "जवाहरलाल नेहरू", "सरदार पटेल"], correct: 0 },
      { id: 2, text: "विश्व पर्यावरण दिवस (World Environment Day) कब मनाया जाता है?", options: ["5 जून", "22 अप्रैल", "1 मई", "16 सितंबर"], correct: 0 },
      { id: 3, text: "मानव शरीर की सबसे बड़ी ग्रंथि (Largest Gland) कौन सी है?", options: ["अग्न्याशय (Pancreas)", "थायरॉयड", "यकृत (Liver)", "पीयूष ग्रंथि"], correct: 2 },
      { id: 4, text: "भारतीय संविधान सभा के प्रारूप समिति के अध्यक्ष कौन थे?", options: ["डॉ. भीमराव अंबेडकर", "जवाहरलाल नेहरू", "के. एम. मुंशी", "बी. एन. राव"], correct: 0 },
      { id: 5, text: "भारत का सबसे दक्षिणी बिंदु 'इंदिरा पॉइंट' कहाँ स्थित है?", options: ["तमिलनाडु", "लक्षद्वीप", "ग्रेट निकोबार", "केरल"], correct: 2 }
    ];

    let currentQ = 0;
    let answers = {}; // { index: selectedOption }
    let markedReview = new Set();
    let visited = new Set([0]);

    // 10 minutes timer (in seconds)
    let timeLeft = 600;
    let timerInterval = null;

    function initMock() {
      renderPalette();
      loadMockQuestion(0);
      startTimer();
    }

    function startTimer() {
      timerInterval = setInterval(() => {
        timeLeft--;
        const mins = Math.floor(timeLeft / 60);
        const secs = timeLeft % 60;
        document.getElementById("timer-display").textContent = 
          `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;

        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          alert("Time's up! Submitting exam automatically.");
          submitExam();
        }
      }, 1000);
    }

    function loadMockQuestion(idx) {
      if (idx < 0 || idx >= MOCK_QUESTIONS.length) return;
      currentQ = idx;
      visited.add(idx);

      const q = MOCK_QUESTIONS[currentQ];
      document.getElementById("q-number-pill").textContent = `Q. ${currentQ + 1} / ${MOCK_QUESTIONS.length}`;
      document.getElementById("mock-question-text").textContent = q.text;

      document.getElementById("mock-prev-btn").disabled = (currentQ === 0);
      document.getElementById("mock-next-btn").innerHTML = (currentQ === MOCK_QUESTIONS.length - 1)
        ? `Submit Test <i class="fa-solid fa-flag-checkered text-[10px]"></i>`
        : `Save & Next <i class="fa-solid fa-chevron-right text-[10px]"></i>`;

      // Update Review Button state
      const isMarked = markedReview.has(currentQ);
      const revBtn = document.getElementById("review-btn");
      revBtn.innerHTML = isMarked
        ? `<i class="fa-solid fa-bookmark"></i> Marked for Review`
        : `<i class="fa-regular fa-bookmark"></i> Mark for Review`;

      // Render Options
      const container = document.getElementById("mock-options-container");
      container.innerHTML = "";

      const alphabet = ["A", "B", "C", "D"];
      const currentSelected = answers[currentQ];

      q.options.forEach((opt, optIdx) => {
        const isSelected = (currentSelected === optIdx);
        const activeBorder = isSelected ? "border-blue-600 bg-blue-50/50" : "border-slate-200 bg-white";
        const radioIcon = isSelected ? "fa-circle-dot text-blue-600" : "fa-circle text-slate-300";

        const btn = document.createElement("button");
        btn.className = `option-radio w-full border-2 rounded-2xl p-3.5 flex items-center justify-between text-left shadow-sm ${activeBorder}`;
        btn.onclick = () => selectOption(optIdx);

        btn.innerHTML = `
          <div class="flex items-center gap-3">
            <span class="w-6 h-6 rounded-lg ${isSelected ? 'bg-blue-600 text-white' : 'bg-slate-100 text-slate-600'} flex items-center justify-center font-bold text-xs">
              ${alphabet[optIdx]}
            </span>
            <span class="font-semibold text-xs leading-snug text-slate-800">${opt}</span>
          </div>
          <i class="fa-solid ${radioIcon} text-sm"></i>
        `;
        container.appendChild(btn);
      });

      renderPalette();
    }

    function selectOption(optIdx) {
      answers[currentQ] = optIdx;
      loadMockQuestion(currentQ);
    }

    function clearResponse() {
      delete answers[currentQ];
      loadMockQuestion(currentQ);
    }

    function markForReview() {
      if (markedReview.has(currentQ)) {
        markedReview.delete(currentQ);
      } else {
        markedReview.add(currentQ);
      }
      loadMockQuestion(currentQ);
    }

    function saveAndNext() {
      if (currentQ < MOCK_QUESTIONS.length - 1) {
        loadMockQuestion(currentQ + 1);
      } else {
        submitExam();
      }
    }

    function prevMockQuestion() {
      if (currentQ > 0) {
        loadMockQuestion(currentQ - 1);
      }
    }

    // Palette Logic
    function togglePalette() {
      const modal = document.getElementById("palette-modal");
      modal.classList.toggle("hidden");
    }

    function renderPalette() {
      const grid = document.getElementById("palette-grid");
      grid.innerHTML = "";

      MOCK_QUESTIONS.forEach((_, idx) => {
        let bg = "bg-slate-200 text-slate-700"; // not visited

        if (markedReview.has(idx)) {
          bg = "bg-purple-600 text-white";
        } else if (answers.hasOwnProperty(idx)) {
          bg = "bg-emerald-600 text-white";
        } else if (visited.has(idx)) {
          bg = "bg-rose-500 text-white";
        }

        const isCurrent = (idx === currentQ) ? "ring-2 ring-blue-600 ring-offset-1" : "";

        const btn = document.createElement("button");
        btn.className = `w-11 h-11 rounded-xl font-bold text-xs flex items-center justify-center shadow-sm transition active:scale-95 ${bg} ${isCurrent}`;
        btn.textContent = idx + 1;
        btn.onclick = () => {
          loadMockQuestion(idx);
          togglePalette();
        };
        grid.appendChild(btn);
      });
    }

    function confirmExit() {
      if (confirm("Kya aap exam chhodkar wapas jana chahte hain?")) {
        window.location.href = "index.html";
      }
    }

    function submitExam() {
      clearInterval(timerInterval);
      
      let correct = 0;
      let wrong = 0;
      const total = MOCK_QUESTIONS.length;

      MOCK_QUESTIONS.forEach((q, idx) => {
        if (answers.hasOwnProperty(idx)) {
          if (answers[idx] === q.correct) {
            correct++;
          } else {
            wrong++;
          }
        }
      });

      // Marks formula: (+2 for correct, -0.5 for wrong)
      const score = (correct * 2) - (wrong * 0.5);
      const attempted = correct + wrong;
      const accuracy = attempted > 0 ? Math.round((correct / attempted) * 100) : 0;

      document.getElementById("final-score").textContent = `${score} / ${total * 2}`;
      document.getElementById("final-accuracy").textContent = `${accuracy}%`;
      document.getElementById("final-correct").textContent = correct;
      document.getElementById("final-wrong").textContent = wrong;

      document.getElementById("result-modal").classList.remove("hidden");
    }

    document.addEventListener("DOMContentLoaded", initMock);
  </script>
</body>
</html>

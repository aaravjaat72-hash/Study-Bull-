<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title id="page-title">Study Bull - Online Test Portal</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  
  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .card-btn {
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    }
    .card-btn:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body class="bg-[#f4f7fb] min-h-screen text-slate-800 pb-12 select-none">

  <!-- TOP HEADER (Clean - No Tabs) -->
  <header class="bg-[#0b47b3] text-white py-3.5 px-4 shadow sticky top-0 z-50">
    <div class="max-w-md mx-auto flex items-center gap-3">
      <!-- Logo Container -->
      <div id="app-logo-box" class="w-11 h-11 bg-white text-[#0b47b3] font-black text-xl flex items-center justify-center rounded-xl shadow-sm border border-blue-200 overflow-hidden flex-shrink-0">
        <!-- Logo JS se load hoga -->
      </div>
      <div>
        <h1 id="app-name-display" class="text-xl font-bold leading-tight tracking-tight">Study Bull</h1>
        <p id="app-tagline-display" class="text-xs text-blue-200 font-medium">Online MCQs &amp; Mock Tests</p>
      </div>
    </div>
  </header>

  <!-- MAIN DASHBOARD: 2-COLUMN BUTTONS GRID -->
  <main class="max-w-md mx-auto p-4">
    <div id="category-grid" class="grid grid-cols-2 gap-3.5">
      <!-- Buttons dynamically JS se aayenge -->
    </div>
  </main>

  <!-- ========================================== -->
  <!-- CONFIGURATION & AUTO-RENDER LOGIC          -->
  <!-- ========================================== -->
  <script>
    /*
      ===============================================================
      YAHAN PAR FUTURE ME BINA KISI JHANJHAT KE EDIT KAR SAKTE HO:
      ===============================================================
    */
    const APP_CONFIG = {
      appName: "Study Bull",
      tagline: "Online MCQs & Mock Tests",
      logoImage: "", // Image logo path (e.g. "assets/logo.png") ya blank chhod do
      shortLogoText: "SB"
    };

    /*
      GRID BUTTONS LIST:
      New button add karne ke liye bas ek block add kar do.
    */
    const CATEGORIES = [
      {
        id: "statepcs",
        title: "State PCS",
        subtitle: "BPSC, UPPSC, RAS",
        icon: "fa-solid fa-landmark",
        iconBg: "bg-red-50",
        iconColor: "text-red-500",
        badge: "",
        link: "subjects.html?cat=statepcs"
      },
      {
        id: "ssc",
        title: "SSC Exams",
        subtitle: "CGL, MTS, CHSL, GD",
        icon: "fa-solid fa-graduation-cap",
        iconBg: "bg-blue-50",
        iconColor: "text-blue-600",
        badge: "",
        link: "subjects.html?cat=ssc"
      },
      {
        id: "banking",
        title: "Banking",
        subtitle: "SBI, IBPS, RBI",
        icon: "fa-solid fa-building-columns",
        iconBg: "bg-teal-50",
        iconColor: "text-teal-600",
        badge: "",
        link: "subjects.html?cat=banking"
      },
      {
        id: "current_affairs",
        title: "Daily CA",
        subtitle: "Daily Updates",
        icon: "fa-solid fa-newspaper",
        iconBg: "bg-amber-50",
        iconColor: "text-amber-500",
        badge: "LIVE",
        badgeColor: "bg-[#e24b4b]",
        link: "mcq.html?subject=current_affairs"
      },
      {
        id: "test_hub",
        title: "Test Hub MCQs",
        subtitle: "History, Sci, Geo",
        icon: "fa-solid fa-book-open",
        iconBg: "bg-rose-50",
        iconColor: "text-rose-500",
        badge: "",
        link: "subjects.html?cat=hub"
      },
      {
        id: "typing",
        title: "Typing Test",
        subtitle: "Hindi & English",
        icon: "fa-solid fa-keyboard",
        iconBg: "bg-cyan-50",
        iconColor: "text-cyan-600",
        badge: "NEW",
        badgeColor: "bg-[#109868]",
        link: "typing-test.html"
      },
      {
        id: "defense",
        title: "Police & Defense",
        subtitle: "UPP, Delhi Police",
        icon: "fa-solid fa-shield-halved",
        iconBg: "bg-indigo-50",
        iconColor: "text-indigo-600",
        badge: "NEW",
        badgeColor: "bg-[#109868]",
        link: "subjects.html?cat=defense"
      },
      {
        id: "mock_test",
        title: "Real Mock Test",
        subtitle: "Exam Simulation",
        icon: "fa-solid fa-rocket",
        iconBg: "bg-orange-50",
        iconColor: "text-orange-500",
        badge: "",
        isDashed: true,
        link: "mock-test.html"
      }
    ];

    // Auto-Render Engine
    function initializePortal() {
      // 1. Branding Setup
      document.title = `${APP_CONFIG.appName} - Online Test Portal`;
      document.getElementById("app-name-display").textContent = APP_CONFIG.appName;
      document.getElementById("app-tagline-display").textContent = APP_CONFIG.tagline;

      const logoBox = document.getElementById("app-logo-box");
      if (APP_CONFIG.logoImage) {
        logoBox.innerHTML = `<img src="${APP_CONFIG.logoImage}" alt="Logo" class="w-full h-full object-cover">`;
      } else {
        logoBox.textContent = APP_CONFIG.shortLogoText;
      }

      // 2. Buttons Grid Rendering
      const gridContainer = document.getElementById("category-grid");
      gridContainer.innerHTML = CATEGORIES.map(cat => {
        const borderStyle = cat.isDashed 
          ? "border-2 border-dashed border-slate-300 bg-[#f8fafc] shadow-none" 
          : "border border-slate-200 bg-white shadow-sm hover:border-blue-500";

        const badgeHtml = cat.badge ? `
          <span class="absolute top-2.5 right-2.5 ${cat.badgeColor || 'bg-red-600'} text-white text-[9px] font-extrabold px-2 py-0.5 rounded-full tracking-wider">
            ${cat.badge}
          </span>
        ` : "";

        return `
          <a href="${cat.link}" class="card-btn relative ${borderStyle} rounded-2xl p-4 flex flex-col items-center text-center">
            ${badgeHtml}
            <div class="w-14 h-14 ${cat.iconBg} ${cat.iconColor} rounded-2xl flex items-center justify-center text-2xl mb-2.5">
              <i class="${cat.icon}"></i>
            </div>
            <h3 class="font-bold text-slate-800 text-[15px] leading-snug">${cat.title}</h3>
            <p class="text-[11px] text-slate-400 font-medium mt-0.5">${cat.subtitle}</p>
          </a>
        `;
      }).join("");
    }

    document.addEventListener("DOMContentLoaded", initializePortal);
  </script>
</body>
</html>

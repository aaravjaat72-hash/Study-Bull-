<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title id="subjects-page-title">Subjects & Topics - Study Bull</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  
  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .topic-accordion {
      transition: max-height 0.3s ease-out, opacity 0.25s ease;
    }
  </style>
</head>
<body class="bg-[#f4f7fb] min-h-screen text-slate-800 pb-12 select-none">

  <!-- TOP HEADER -->
  <header class="bg-[#0b47b3] text-white py-3.5 px-4 shadow sticky top-0 z-50">
    <div class="max-w-md mx-auto flex items-center gap-3">
      <!-- Back Button -->
      <a href="index.html" class="w-9 h-9 bg-white/10 hover:bg-white/20 active:bg-white/30 rounded-xl flex items-center justify-center text-white transition flex-shrink-0">
        <i class="fa-solid fa-arrow-left text-base"></i>
      </a>
      <div class="truncate">
        <h1 id="category-heading" class="text-base font-bold leading-tight truncate">Subjects &amp; Topics</h1>
        <p id="category-subheading" class="text-[11px] text-blue-200 font-medium">Select a topic folder to start</p>
      </div>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="max-w-md mx-auto p-4">
    <!-- Search Bar -->
    <div class="relative mb-4">
      <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3.5 text-slate-400 text-sm"></i>
      <input 
        type="text" 
        id="search-input" 
        placeholder="Search subject or topic chapter..." 
        class="w-full bg-white border border-slate-200 rounded-xl pl-10 pr-4 py-2.5 text-sm focus:outline-none focus:border-blue-500 shadow-sm"
        oninput="filterTopics()"
      />
    </div>

    <!-- Subjects & Topics Accordion List -->
    <div id="subjects-container" class="space-y-3">
      <!-- Folders dynamically render honge -->
    </div>
  </main>

  <!-- ========================================== -->
  <!-- CONFIGURATION & DYNAMIC DATA ENGINE        -->
  <!-- ========================================== -->
  <script>
    /*
      ===============================================================
      SUBJECTS + CHAPTERS/TOPICS STRUCTURE:
      Future me kisi bhi subject ke andar naya chapter add karne ke liye
      topics array me bas `{ id: '...', name: '...', count: '...' }` add karein.
      ===============================================================
    */
    const CATEGORY_DATA = {
      ssc: {
        title: "SSC Exams",
        subtitle: "CGL, MTS, CHSL, GD Special",
        subjects: [
          {
            id: "history",
            name: "Indian History",
            desc: "NCERT & Previous Year Topics",
            icon: "fa-landmark",
            color: "text-amber-500",
            bg: "bg-amber-50",
            topics: [
              { id: "ancient_history", name: "Ancient India (प्राचीन भारत)", count: "120 MCQs" },
              { id: "medieval_history", name: "Medieval India (मध्यकालीन भारत)", count: "150 MCQs" },
              { id: "modern_history", name: "Modern India & Freedom (आधुनिक भारत)", count: "180 MCQs" }
            ]
          },
          {
            id: "polity",
            name: "Indian Polity",
            desc: "Constitution, Articles & Parliament",
            icon: "fa-scale-balanced",
            color: "text-indigo-500",
            bg: "bg-indigo-50",
            topics: [
              { id: "preamble_articles", name: "Preamble & Important Articles", count: "110 MCQs" },
              { id: "parliament_judiciary", name: "Parliament & Supreme Court", count: "130 MCQs" },
              { id: "panchayati_raj", name: "Panchayati Raj & Amendments", count: "80 MCQs" }
            ]
          },
          {
            id: "geography",
            name: "Geography",
            desc: "Indian Rivers, Mountains & Climate",
            icon: "fa-earth-asia",
            color: "text-blue-500",
            bg: "bg-blue-50",
            topics: [
              { id: "indian_rivers", name: "Indian Rivers & Lakes (नदियां व झीलें)", count: "95 MCQs" },
              { id: "mountains_climate", name: "Mountains & Climate of India", count: "140 MCQs" },
              { id: "solar_system", name: "Solar System & Earth Basics", count: "75 MCQs" }
            ]
          },
          {
            id: "science",
            name: "General Science",
            desc: "Physics, Chemistry & Biology",
            icon: "fa-flask-vial",
            color: "text-emerald-500",
            bg: "bg-emerald-50",
            topics: [
              { id: "biology_human", name: "Human Physiology & Diseases", count: "180 MCQs" },
              { id: "physics_units", name: "Units, Light & Mechanics", count: "120 MCQs" },
              { id: "chemistry_elements", name: "Chemical Reactions & Everyday Chem", count: "110 MCQs" }
            ]
          }
        ]
      },
      statepcs: {
        title: "State PCS",
        subtitle: "BPSC, UPPSC, RAS & Special GS",
        subjects: [
          {
            id: "history",
            name: "Indian History & Culture",
            desc: "Art, Architecture & National Movement",
            icon: "fa-monument",
            color: "text-amber-500",
            bg: "bg-amber-50",
            topics: [
              { id: "modern_history", name: "National Movement (1857 - 1947)", count: "210 MCQs" },
              { id: "art_culture", name: "Indian Art & Architecture", count: "140 MCQs" }
            ]
          },
          {
            id: "economy",
            name: "Indian Economy",
            desc: "Budget, Banking & NITI Aayog",
            icon: "fa-chart-line",
            color: "text-teal-500",
            bg: "bg-teal-50",
            topics: [
              { id: "budget_schemes", name: "Union Budget & Govt Schemes", count: "160 MCQs" },
              { id: "rbi_monetary", name: "RBI & Monetary Policy", count: "120 MCQs" }
            ]
          }
        ]
      },
      defense: {
        title: "Police & Defense",
        subtitle: "UP Police, Delhi Police & SSC GD",
        subjects: [
          {
            id: "gs",
            name: "General Knowledge (GK)",
            desc: "Static GK, Awards & Books",
            icon: "fa-shield-halved",
            color: "text-blue-500",
            bg: "bg-blue-50",
            topics: [
              { id: "static_gk", name: "Important Days, Books & Authors", count: "220 MCQs" },
              { id: "first_in_india", name: "First in India (Male/Female)", count: "130 MCQs" }
            ]
          },
          {
            id: "hindi",
            name: "General Hindi",
            desc: "Grammar, Muhavare & Sandhi",
            icon: "fa-book",
            color: "text-orange-500",
            bg: "bg-orange-50",
            topics: [
              { id: "hindi_sandhi", name: "Sandhi & Samas (संधि और समास)", count: "150 MCQs" },
              { id: "hindi_vilom", name: "Vilom & Paryayvachi Shabda", count: "190 MCQs" }
            ]
          }
        ]
      }
    };

    let currentData = null;
    let activeCategory = 'ssc';
    let openSubjectId = null;

    function initPage() {
      const urlParams = new URLSearchParams(window.location.search);
      activeCategory = urlParams.get('cat') || 'ssc';

      currentData = CATEGORY_DATA[activeCategory] || CATEGORY_DATA.ssc;

      document.getElementById("category-heading").textContent = currentData.title;
      document.getElementById("category-subheading").textContent = currentData.subtitle;
      document.getElementById("subjects-page-title").textContent = `${currentData.title} - Study Bull`;

      renderList(currentData.subjects);
    }

    function renderList(subjectsList) {
      const container = document.getElementById("subjects-container");

      if (subjectsList.length === 0) {
        container.innerHTML = `
          <div class="text-center py-12 text-slate-400">
            <i class="fa-solid fa-folder-open text-4xl mb-2 text-slate-300"></i>
            <p class="text-xs font-semibold">Koi subject ya topic nahi mila</p>
          </div>
        `;
        return;
      }

      container.innerHTML = subjectsList.map(sub => {
        const isOpen = (openSubjectId === sub.id);
        const totalTopics = sub.topics ? sub.topics.length : 0;

        return `
          <div class="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden transition">
            
            <!-- Subject Header Card (Click to expand topics) -->
            <button 
              onclick="toggleSubject('${sub.id}')" 
              class="w-full p-3.5 flex items-center justify-between text-left active:bg-slate-50 transition">
              
              <div class="flex items-center gap-3">
                <div class="w-11 h-11 ${sub.bg} ${sub.color} rounded-xl flex items-center justify-center text-lg flex-shrink-0">
                  <i class="fa-solid ${sub.icon}"></i>
                </div>
                <div>
                  <h3 class="font-bold text-slate-800 text-sm leading-tight">${sub.name}</h3>
                  <p class="text-[11px] text-slate-400 font-medium mt-0.5">${sub.desc}</p>
                </div>
              </div>

              <div class="flex items-center gap-2">
                <span class="text-[11px] font-bold text-blue-600 bg-blue-50 px-2 py-0.5 rounded-md whitespace-nowrap">
                  ${totalTopics} Topics
                </span>
                <i class="fa-solid fa-chevron-down text-xs text-slate-400 transition-transform duration-200 ${isOpen ? 'rotate-180 text-blue-600' : ''}"></i>
              </div>

            </button>

            <!-- Topics Sub-folder List (Expandable) -->
            <div class="${isOpen ? 'block' : 'hidden'} border-t border-slate-100 bg-[#fbfcfd] px-3.5 py-2.5 space-y-2">
              ${sub.topics.map((t, idx) => `
                <a href="mcq.html?cat=${activeCategory}&subject=${sub.id}&topic=${t.id}" 
                   class="bg-white border border-slate-200/80 hover:border-blue-400 rounded-xl p-2.5 flex items-center justify-between active:scale-[0.98] transition shadow-xs block">
                  
                  <div class="flex items-center gap-2.5">
                    <span class="w-6 h-6 rounded-lg bg-blue-50 text-blue-600 font-black text-[10px] flex items-center justify-center">
                      ${idx + 1}
                    </span>
                    <span class="text-xs font-semibold text-slate-700 leading-snug">${t.name}</span>
                  </div>

                  <div class="flex items-center gap-1.5 flex-shrink-0">
                    <span class="text-[10px] text-slate-400 font-bold">${t.count}</span>
                    <i class="fa-solid fa-play text-[9px] text-blue-600 bg-blue-50 p-1.5 rounded-full"></i>
                  </div>

                </a>
              `).join("")}
            </div>

          </div>
        `;
      }).join("");
    }

    function toggleSubject(id) {
      openSubjectId = (openSubjectId === id) ? null : id;
      renderList(currentData.subjects);
    }

    function filterTopics() {
      const q = document.getElementById("search-input").value.toLowerCase();
      if (!q) {
        renderList(currentData.subjects);
        return;
      }

      const filtered = currentData.subjects.map(sub => {
        const matchedTopics = sub.topics.filter(t => t.name.toLowerCase().includes(q));
        const subMatches = sub.name.toLowerCase().includes(q) || sub.desc.toLowerCase().includes(q);

        if (subMatches || matchedTopics.length > 0) {
          return {
            ...sub,
            topics: matchedTopics.length > 0 ? matchedTopics : sub.topics
          };
        }
        return null;
      }).filter(Boolean);

      // Auto expand on search
      if (filtered.length > 0) {
        openSubjectId = filtered[0].id;
      }
      renderList(filtered);
    }

    document.addEventListener("DOMContentLoaded", initPage);
  </script>
</body>
</html>
